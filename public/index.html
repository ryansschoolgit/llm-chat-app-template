<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
		/>
		<meta name="color-scheme" content="light dark" />
		<title>Ryan's AI</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--display:
					"Bricolage Grotesque", "Instrument Sans", -apple-system,
					BlinkMacSystemFont, "Segoe UI", sans-serif;
				--body:
					"Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI",
					Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;

				/* light */
				--bg: #f4f5f9;
				--surface: #ffffff;
				--surface-2: #e8eaf2;
				--border: #d9dcea;
				--text: #14162b;
				--text-soft: #62667f;

				--accent: #2f45ff;
				--accent-hover: #2136e6;
				--on-accent: #ffffff;
				--spark: #ffd83d;

				--code-bg: #e8eaf2;
				--shadow: 0 1px 2px rgba(20, 22, 43, 0.05),
					0 18px 40px -18px rgba(47, 69, 255, 0.28);
			}

			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #0d0f1c;
					--surface: #161930;
					--surface-2: #1f2340;
					--border: #2a2f52;
					--text: #eceefb;
					--text-soft: #9599b8;

					--accent: #4a5cff;
					--accent-hover: #6274ff;
					--on-accent: #ffffff;
					--spark: #ffd83d;

					--code-bg: #1f2340;
					--shadow: 0 1px 2px rgba(0, 0, 0, 0.4),
						0 22px 48px -20px rgba(0, 0, 0, 0.7);
				}
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			html,
			body {
				height: 100%;
			}

			body {
				font-family: var(--body);
				font-size: 16px;
				line-height: 1.6;
				color: var(--text);
				background: var(--bg);
				display: flex;
				flex-direction: column;
				padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0)
					env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
				-webkit-font-smoothing: antialiased;
			}

			/* ---------- Header ---------- */
			header {
				width: 100%;
				max-width: 820px;
				margin: 0 auto;
				padding: 1.25rem 1.5rem 0.5rem;
			}

			.brand {
				display: inline-flex;
				align-items: center;
				gap: 0.65rem;
			}

			.brand-mark {
				flex: none;
				width: 34px;
				height: 34px;
				border-radius: 11px;
				background: var(--accent);
				position: relative;
			}

			.brand-mark::after {
				content: "";
				position: absolute;
				right: 7px;
				top: 7px;
				width: 10px;
				height: 10px;
				border-radius: 50%;
				background: var(--spark);
			}

			h1 {
				font-family: var(--display);
				font-weight: 700;
				font-size: 1.3rem;
				letter-spacing: -0.02em;
				line-height: 1;
			}

			/* ---------- Chat ---------- */
			.chat-container {
				flex: 1;
				min-height: 0;
				width: 100%;
				max-width: 820px;
				margin: 0 auto;
				display: flex;
				flex-direction: column;
				padding: 0 1.5rem;
			}

			.chat-messages {
				flex: 1;
				min-height: 0;
				overflow-y: auto;
				display: flex;
				flex-direction: column;
				gap: 1.4rem;
				padding: 1.25rem 0 1.5rem;
				scroll-behavior: smooth;
				scrollbar-width: thin;
				scrollbar-color: var(--border) transparent;
			}

			.message {
				font-size: 1rem;
			}

			.message p {
				white-space: pre-line;
				margin: 0;
				overflow-wrap: anywhere;
			}

			/* You */
			.user-message {
				align-self: flex-end;
				max-width: min(80%, 560px);
				background: var(--accent);
				color: var(--on-accent);
				padding: 0.75rem 1.1rem;
				border-radius: 22px 22px 6px 22px;
			}

			/* The assistant: no bubble, just readable text with a marker */
			.assistant-message {
				align-self: flex-start;
				max-width: 66ch;
				position: relative;
				padding-left: 2.1rem;
			}

			.assistant-message::before {
				content: "";
				position: absolute;
				left: 0;
				top: 0.42rem;
				width: 16px;
				height: 16px;
				border-radius: 5px;
				background: var(--accent);
			}

			.assistant-message::after {
				content: "";
				position: absolute;
				left: 8px;
				top: 0.5rem;
				width: 5px;
				height: 5px;
				border-radius: 50%;
				background: var(--spark);
			}

			.message code {
				font-size: 0.88em;
				background: var(--code-bg);
				padding: 0.12em 0.4em;
				border-radius: 6px;
			}

			.message pre {
				background: var(--code-bg);
				padding: 0.9rem 1rem;
				border-radius: 12px;
				overflow-x: auto;
				margin: 0.6rem 0;
			}

			.message pre code {
				background: none;
				padding: 0;
			}

			/* ---------- Empty state: the greeting becomes the hero ---------- */
			.chat-container:has(.chat-messages > .assistant-message:only-child)
				.chat-messages {
				justify-content: center;
			}

			.chat-messages > .assistant-message:only-child {
				max-width: 18em;
				padding-left: 0;
				font-family: var(--display);
				font-weight: 500;
				font-size: clamp(1.7rem, 5.4vw, 2.6rem);
				line-height: 1.15;
				letter-spacing: -0.025em;
				animation: arrive 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both;
			}

			.chat-messages > .assistant-message:only-child::before {
				position: static;
				display: block;
				width: 44px;
				height: 44px;
				border-radius: 14px;
				margin-bottom: 1.4rem;
			}

			.chat-messages > .assistant-message:only-child::after {
				left: 30px;
				top: 12px;
				width: 12px;
				height: 12px;
			}

			@keyframes arrive {
				from {
					opacity: 0;
					transform: translateY(14px);
				}
				to {
					opacity: 1;
					transform: none;
				}
			}

			/* ---------- Typing indicator ---------- */
			.typing-indicator {
				display: none;
				align-items: center;
				gap: 0.7rem;
				font-size: 0.875rem;
				color: var(--text-soft);
				padding: 0 0 0.9rem 2.1rem;
			}

			.typing-indicator.visible {
				display: flex;
			}

			.typing-indicator::after {
				content: "";
				width: 5px;
				height: 5px;
				border-radius: 50%;
				background: var(--accent);
				box-shadow:
					10px 0 0 var(--accent),
					20px 0 0 var(--accent);
				margin-right: 20px;
				animation: pulse 1.2s ease-in-out infinite;
			}

			@keyframes pulse {
				0%,
				100% {
					opacity: 0.25;
				}
				50% {
					opacity: 1;
				}
			}

			/* ---------- Suggestions (only before the first message) ---------- */
			.suggestions {
				display: flex;
				flex-wrap: wrap;
				gap: 0.5rem;
				padding-bottom: 0.9rem;
			}

			.chat-container:has(.user-message) .suggestions {
				display: none;
			}

			.suggestions button {
				font: inherit;
				font-size: 0.9rem;
				color: var(--text);
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: 999px;
				padding: 0.45rem 0.95rem;
				cursor: pointer;
				transition:
					border-color 0.15s,
					background-color 0.15s;
			}

			.suggestions button:hover {
				border-color: var(--accent);
				background: var(--surface-2);
			}

			.suggestions button:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
			}

			/* ---------- Composer ---------- */
			.message-input {
				display: flex;
				align-items: flex-end;
				gap: 0.5rem;
				padding: 0.55rem 0.55rem 0.55rem 1.25rem;
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: 28px;
				box-shadow: var(--shadow);
				transition:
					border-color 0.15s,
					box-shadow 0.15s;
			}

			.message-input:focus-within {
				border-color: var(--accent);
				box-shadow:
					0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent),
					var(--shadow);
			}

			#user-input {
				flex: 1;
				border: none;
				outline: none;
				background: transparent;
				color: var(--text);
				font: inherit;
				resize: none;
				min-height: 44px;
				max-height: 170px;
				padding: 0.6rem 0;
			}

			#user-input::placeholder {
				color: var(--text-soft);
			}

			#send-button {
				flex: none;
				width: 44px;
				height: 44px;
				display: grid;
				place-items: center;
				border: none;
				border-radius: 50%;
				background: var(--accent);
				color: var(--on-accent);
				cursor: pointer;
				transition:
					background-color 0.15s,
					transform 0.1s;
			}

			#send-button:hover {
				background: var(--accent-hover);
			}

			#send-button:active {
				transform: scale(0.93);
			}

			#send-button:disabled {
				background: var(--surface-2);
				color: var(--text-soft);
				cursor: not-allowed;
				transform: none;
			}

			#send-button:focus-visible {
				outline: 2px solid var(--text);
				outline-offset: 2px;
			}

			/* ---------- Footer ---------- */
			footer {
				text-align: center;
				font-size: 0.75rem;
				color: var(--text-soft);
				padding: 0.9rem 1rem 1rem;
			}

			/* ---------- Small screens ---------- */
			@media (max-width: 560px) {
				header {
					padding: 1rem 1rem 0.25rem;
				}
				.chat-container {
					padding: 0 1rem;
				}
				.user-message {
					max-width: 90%;
				}
				.assistant-message {
					max-width: 100%;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.chat-messages {
					scroll-behavior: auto;
				}
				.chat-messages > .assistant-message:only-child,
				.typing-indicator::after {
					animation: none;
				}
			}
		</style>
	</head>
	<body>
		<header>
			<div class="brand">
				<span class="brand-mark" aria-hidden="true"></span>
				<h1>Ryan's AI</h1>
			</div>
		</header>

		<div class="chat-container">
			<div id="chat-messages" class="chat-messages" aria-live="polite">
				<div class="message assistant-message">
					<p>
						Hello! I'm an LLM chat app powered by Cloudflare Workers AI. How can
						I help you today?
					</p>
				</div>
			</div>

			<div class="typing-indicator" id="typing-indicator">
				AI is thinking
			</div>

			<div class="suggestions" id="suggestions">
				<button type="button" data-prompt="Explain how the internet works in simple terms">
					Explain the internet
				</button>
				<button type="button" data-prompt="Help me write a polite email declining a meeting">
					Write an email
				</button>
				<button type="button" data-prompt="Give me three weekend project ideas">
					Weekend project ideas
				</button>
			</div>

			<div class="message-input">
				<textarea
					id="user-input"
					placeholder="Ask anything"
					aria-label="Message"
					rows="1"
					autofocus
				></textarea>
				<button id="send-button" aria-label="Send message">
					<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<path d="M12 19V5" />
						<path d="m5 12 7-7 7 7" />
					</svg>
				</button>
			</div>
		</div>

		<footer>
			<p>Cloudflare Workers AI Chat Template &copy; 2025</p>
		</footer>

		<!-- Textarea auto-grow + suggestion chips -->
		<script>
			(function () {
				var input = document.getElementById("user-input");
				var send = document.getElementById("send-button");
				if (!input) return;

				function grow() {
					input.style.height = "auto";
					input.style.height = Math.min(input.scrollHeight, 170) + "px";
				}
				input.addEventListener("input", grow);

				// chat.js clears the value after sending; reset the height then too
				var desc = Object.getOwnPropertyDescriptor(
					HTMLTextAreaElement.prototype,
					"value",
				);
				Object.defineProperty(input, "value", {
					get: function () {
						return desc.get.call(this);
					},
					set: function (v) {
						desc.set.call(this, v);
						grow();
					},
				});

				var chips = document.getElementById("suggestions");
				if (chips) {
					chips.addEventListener("click", function (e) {
						var btn = e.target.closest("button[data-prompt]");
						if (!btn) return;
						input.value = btn.getAttribute("data-prompt");
						send.click();
					});
				}
			})();
		</script>

		<!-- Chat app script -->
		<script src="chat.js"></script>
	</body>
</html>
